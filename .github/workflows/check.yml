name: Public package checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python scripts/release.py validate
      - run: python -m pip install jsonschema==4.25.1
      - run: python scripts/validate_schemas.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/release.py build
      - run: npm install --global @anthropic-ai/claude-code@2.1.287
      - run: claude plugin validate --strict indaga
      - run: claude plugin validate --strict .claude-plugin/marketplace.json
      - run: git diff --exit-code
